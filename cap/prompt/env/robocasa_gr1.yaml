# API spec for RoboCasa with GR1ArmsOnly (bimanual, 7-DOF per arm).
#
# This file is the authoritative tool reference passed to the LLM.
# Only tools listed here should be called by generated code.
# Pipeline-only functions (reset_env, load_task) are intentionally excluded.

env: robocasa
robot: GR1ArmsOnly
arms: ["left", "right"]
cameras: ["top", "wrist"]
control_freq_hz: 20
gripper_range: [0.0, 1.0]   # 0=closed, 1=open

tools:
  get_robot_state:
    description: >
      Get current joint positions, gripper states, and EE poses for both arms.
    params: {}
    returns: RobotState

  freespace_move:
    description: >
      Move end-effector to target position and orientation via OSC_POSE
      controller. Blocking — waits until the arm reaches the target or times
      out. No external IK needed.
    params:
      side:
        type: str
        values: ["left", "right"]
        doc: "Arm side."
      pos:
        type: "list[float]"
        doc: "Target [x, y, z] in meters, world frame."
      quat:
        type: "list[float]"
        doc: "Target orientation [x, y, z, w] quaternion. Reuse ee_quat from get_robot_state() — do NOT compute quaternions."
      gripper:
        type: float
        optional: true
        doc: "Gripper value (0.0=closed, 1.0=open). Omit to leave unchanged."
      max_duration_sec:
        type: float
        optional: true
        default: 5.0
        doc: "Timeout in seconds. Increase for long moves (>0.3 m)."
      max_vel:
        type: float
        optional: true
        default: 0.5
        doc: "Max EE translation speed in m/s."
      tol:
        type: float
        optional: true
        default: 0.02
        doc: "Position convergence tolerance in meters."
    returns: MoveResult

  set_gripper:
    description: >
      Set gripper position on the specified arm. Blocking — waits until settled.
    params:
      side:
        type: str
        values: ["left", "right"]
        doc: "Arm side."
      pos:
        type: float
        doc: "0.0 = fully closed, 1.0 = fully open."
    returns: None

  open_gripper:
    description: "Fully open the gripper. Shortcut for set_gripper(side, 1.0)."
    params:
      side:
        type: str
        values: ["left", "right"]
        doc: "Arm side."
    returns: None

  close_gripper:
    description: "Fully close the gripper. Shortcut for set_gripper(side, 0.0)."
    params:
      side:
        type: str
        values: ["left", "right"]
        doc: "Arm side."
    returns: None

  get_camera_image:
    description: "Get latest RGB image from a camera."
    params:
      camera:
        type: str
        values: ["top", "wrist"]
        doc: "Camera name."
    returns: np.ndarray

  detect_object:
    description: >
      Detect objects in the scene. Use backend='oracle' for sim ground-truth
      positions (preferred in RoboCasa). Substring-matches query against
      scene object names.
    params:
      query:
        type: str
        doc: "Object name or substring to search for."
      camera:
        type: str
        default: "top"
        doc: "Camera name (only used for vision backends, ignored by oracle)."
      backend:
        type: str
        default: "oracle"
        doc: "'oracle' for sim ground truth (recommended), 'bundlesdf' for vision."
    returns: "list[Detection3D]"

  get_task_info:
    description: >
      Get task state from the environment: reward, success flag, done flag,
      and object positions. Use this to check progress and get ground-truth
      object locations.
    params: {}
    returns: "dict  # {done: bool, reward: float, success: bool, env_name: str, obj_pos: list[float], ...}"

  vlm_query:
    description: >
      Ask a vision-language model about the scene. Useful for spatial
      reasoning, counting objects, verifying grasp success, reading labels.
    params:
      query:
        type: str
        doc: "Natural language question about the scene."
      camera:
        type: str
        default: "top"
        doc: "Camera name, or 'all' for multi-camera composite."
    returns: str

return_types:
  RobotState:
    description: "Robot state container."
    fields:
      arms: "dict[str, ArmState] — keyed by 'left' and 'right'"
  ArmState:
    description: "Per-arm state."
    fields:
      joint_pos: "list[float] — 7 joint positions in radians"
      gripper_pos: "float — 0.0 (closed) to 1.0 (open)"
      ee_pos: "list[float] — [x, y, z] end-effector position in meters, world frame"
      ee_quat: "list[float] — [x, y, z, w] quaternion"
      ee_rpy: "list[float] — [roll, pitch, yaw] in degrees"
  MoveResult:
    description: "Result from freespace_move."
    fields:
      reached: "bool — whether the EE converged to the target"
      feasible: "bool — whether the controller found a valid path"
      cmd_pos_err: "float | None — final position error in meters"
  Detection3D:
    description: "3D detection result."
    fields:
      label: "str — object name"
      score: "float — confidence (always 1.0 for oracle)"
      position_3d: "list[float] — [x, y, z] in meters, world frame"
      quaternion_xyzw: "list[float] — [x, y, z, w]"
      half_extents: "list[float] — bounding box half-sizes [dx, dy, dz]"

constraints:
  - "Bimanual robot — 'left' and 'right' arms available."
  - "No external IK — OSC_POSE handles it. Just send EE position + orientation targets."
  - "Always reuse ee_quat from get_robot_state(). Never compute quaternions manually."
  - "get_task_info()['obj_pos'] gives ground-truth object XYZ. Prefer this over vision detection."
  - "Gripper: 0.0 = closed, 1.0 = open."
  - "Increase max_duration_sec for long-range moves (>0.3 m): use 10–15 s."
  - "Wrap freespace_move in try/except — partial moves are OK, continue to next step."
  - "For bimanual tasks, plan which arm handles which subtask before writing code."
  - "numpy is available as `np` in the execution namespace."
