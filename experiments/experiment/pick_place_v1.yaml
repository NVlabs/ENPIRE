# @package _global_
name: pick_place_v1
task: "Pick up the object on the counter and place it in the cabinet"
max_iterations: 3

env:
  name: "robocasa:PickPlaceCounterToCabinet"

steps:
  - observer
  - code_generator
  - executor
  - reward_evaluator
  - self_reflection

reflection:
  strategy: composite
  cameras: [top, wrist]
  vlm_backend: gemini

recording:
  enabled: true
  per_iteration: true

reflect: true
