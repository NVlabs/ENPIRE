# @package env
# Remote deployment environment - Portal SERVER for RL data collection
#
# This env runs a Portal server (same protocol as serve_policy.py).
# The remote robot (lecar-tbd yam_control_loop) connects as the Portal CLIENT.
#
# Robot sends:  step({images, states, text, embodiment, ...}) -> action_dict
# This env:     queues obs for RL actor, sends action_dict from RL actor to robot
#
# Usage (on RL training machine):
#   uv run scripts/pld_lite/train_delta_rlpd.py task=remote_yam \
#     env.remote_port=8964 train.actor=True
#
# Then on robot machine (lecar-tbd):
#   uv run python -m experimental.yam_control_loop \
#     --action-horizon=20 --server-address="<RL_MACHINE_IP>:8964"

env_name: "remote_deployment"
is_sim: false

# Arm control mode: "left", "right", or "both" (default)
# "left"/"right" reduces action_dim to 7 and proprio to the active arm only.
control_mode: "both"

# Triggers Portal-server env creation in env_launcher.py
teleop_wrapper_path: "serl_launcher.env.remote_deployment_env.RemoteDeploymentEnv"

# Portal server host/port. For multi-machine deployments, remote_host should be
# the actor machine address that the robot/control machine can reach.
remote_host: "0.0.0.0"
remote_port: 8964
remote_server_address: ${.remote_host}:${.remote_port}

# Generic fallback observation keys. Task configs should override task-specific
# camera/proprio selections.
image_keys: ["top_camera_image", "left_camera_image"]
proprio_keys: ["left_joint_pos", "left_gripper_pos", "right_joint_pos", "right_gripper_pos"]
image_height: 256
image_width: 256

# Action config
remote_action_dim: 14         # 6+1+6+1 bimanual joint+gripper unless action_repr overrides semantics
action_repr: "joint"          # "joint", "delta_eef_quat", "delta_eef_rot6d", or "delta_eef_pos"
remote_action_exec_horizon: 20  # must match --action-horizon in lecar-tbd

# Placeholder input size before SERLObsWrapper applies image_height/image_width.
remote_image_height: 480
remote_image_width: 640

# Optional timeout for step/reset RPC (null = block indefinitely, good for testing)
# Use ~30.0 seconds for real robot to avoid hangs
remote_step_timeout: null

# Language instruction for base agents
instruction: ""

obs_horizon: 1

# Compatibility flags (unused for remote_deployment but required by some pipelines)
ignore_gripper: false
ignore_base_gripper: false
add_base_action_to_obs: false

