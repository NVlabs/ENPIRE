# @package _global_
# Clean right-arm PLD setup:
#   algorithm action: 3-D normalized delta position [dx, dy, dz]
#   remote-env action: 10-D delta_eef_rot6d [dpos(3), id_rot6d(6), closed_grip(1)]
#   rotation/gripper: fixed by actor expansion, not learned by SACMini

defaults:
  - remote_yam_right
  - override /train: sac_mini
  - override /action_scaling: yam_delta_eef_pos3
  - _self_

exp_name: "remote_yam_right_pos3"

env:
  # Observation keys and instruction are inherited from remote_yam_right.
  # Keep this task aligned with remote_yam_right unless the physical camera /
  # proprio setup changes.
  control_mode: "right"
  remote_action_dim: 10
  action_repr: "delta_eef_rot6d"   # wire repr sent to Forge (10-D)

task:
  task_suite_name: "remote_yam_right_pos3"
  # env.action_repr is the 10-D wire format sent to Forge over Portal.
  # task.action_repr is the 3-D policy/replay-buffer space; the actor
  # expands it to env.action_repr before calling env.step().
  action_repr: "delta_eef_pos"     # policy repr (3-D xyz, learned by SACMini)
  mask_delta_rotation: false
  mask_gripper: false

