[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enpire-pld-runtime"
version = "0.1.0"
description = "Isolated JAX PLD/SERL actor and learner runtime for ENPIRE."
requires-python = ">=3.11,<3.12"
dependencies = [
  "agentlace==0.1.4",
  "hydra-core==1.3.2",
  "jax[cuda12]==0.6.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "jaxlib==0.6.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "matplotlib>=3.8",
  "msgpack>=1.0",
  "numpy>=1.26.4,<2",
  "opencv-python>=4.10,<5",
  "portal>=3.7.3",
  "protobuf==5.29.6",
  "rich>=13",
  "serl-launcher==0.1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
agentlace = { path = "vendor/agentlace", editable = true }
serl-launcher = { path = "vendor/serl_launcher", editable = true }

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
override-dependencies = [
  "ml-dtypes>=0.5.1",
  "numpy>=1.26.4,<2",
  "protobuf==5.29.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E701", "E702", "E731", "E722", "E402", "E741", "F841"]
