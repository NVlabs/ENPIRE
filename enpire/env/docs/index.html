<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YAM Docs Wiki</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --bg-side: #f8f9fb;
      --bg-code: #f4f5f7;
      --border: #e1e4e8;
      --text: #1f2328;
      --text-dim: #656d76;
      --accent: #0969da;
      --accent-bg: #ddf4ff;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      display: flex;
      color: var(--text);
      background: var(--bg);
      font-size: 15px;
      line-height: 1.6;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 260px;
      min-width: 260px;
      height: 100vh;
      overflow-y: auto;
      border-right: 1px solid var(--border);
      background: var(--bg-side);
      display: flex;
      flex-direction: column;
    }
    .side-header {
      padding: 20px 20px 12px;
      border-bottom: 1px solid var(--border);
    }
    .side-header h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .side-header h1 a { color: var(--text); text-decoration: none; }
    .side-header .subtitle { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
    #search-box {
      display: block;
      width: calc(100% - 32px);
      margin: 12px 16px 8px;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      background: var(--bg);
      outline: none;
    }
    #search-box:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(9,105,218,.12); }
    #nav-tree { flex: 1; overflow-y: auto; padding: 4px 0 20px; }

    .cat-header {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-dim);
      padding: 14px 20px 5px;
      cursor: pointer;
      user-select: none;
    }
    .cat-header::before { content: "\25BE "; font-size: 9px; }
    .cat-header.collapsed::before { content: "\25B8 "; }
    .cat-list { list-style: none; }
    .cat-header.collapsed + .cat-list { display: none; }
    .cat-list li a {
      display: block;
      padding: 3px 20px 3px 28px;
      font-size: 13px;
      color: var(--text);
      text-decoration: none;
      border-radius: 0;
      transition: background .1s;
    }
    .cat-list li a:hover { background: rgba(0,0,0,.04); }
    .cat-list li a.active { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
    .cat-list li a.hidden { display: none; }

    /* ── Main content ── */
    #content-wrap {
      flex: 1;
      overflow-y: auto;
      display: flex;
      justify-content: center;
    }
    #content {
      width: 100%;
      max-width: 820px;
      padding: 32px 40px 80px;
    }

    /* Breadcrumb */
    .crumb { font-size: 12px; color: var(--text-dim); margin-bottom: 16px; }
    .crumb a { color: var(--accent); text-decoration: none; }
    .crumb a:hover { text-decoration: underline; }

    /* ── Rendered markdown ── */
    .md h1 { font-size: 26px; font-weight: 700; border-bottom: 2px solid var(--border); padding-bottom: 8px; margin: 0 0 20px; }
    .md h2 { font-size: 21px; font-weight: 600; border-bottom: 1px solid var(--border); padding-bottom: 6px; margin: 28px 0 14px; }
    .md h3 { font-size: 17px; font-weight: 600; margin: 22px 0 8px; }
    .md h4 { font-size: 15px; font-weight: 600; margin: 18px 0 6px; }
    .md h5, .md h6 { font-size: 14px; font-weight: 600; margin: 14px 0 4px; }
    .md p { margin: 0 0 14px; }
    .md ul, .md ol { margin: 0 0 14px; padding-left: 26px; }
    .md li { margin-bottom: 3px; }
    .md li > ul, .md li > ol { margin: 4px 0 4px; }
    .md a { color: var(--accent); text-decoration: none; }
    .md a:hover { text-decoration: underline; }
    .md strong { font-weight: 600; }
    .md code {
      font-family: var(--mono);
      font-size: 0.87em;
      background: var(--bg-code);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .md pre {
      background: var(--bg-code);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 18px;
      overflow-x: auto;
      margin: 0 0 16px;
      line-height: 1.5;
    }
    .md pre code { background: none; padding: 0; border-radius: 0; font-size: 0.85em; }
    .md blockquote {
      border-left: 4px solid var(--accent);
      padding: 8px 16px;
      margin: 0 0 14px;
      color: var(--text-dim);
      background: rgba(9,105,218,.03);
      border-radius: 0 6px 6px 0;
    }
    .md blockquote p:last-child { margin-bottom: 0; }
    .md table { border-collapse: collapse; margin: 0 0 16px; width: 100%; font-size: 14px; }
    .md th, .md td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
    .md th { background: var(--bg-code); font-weight: 600; }
    .md tr:nth-child(even) td { background: #fafbfc; }
    .md img { max-width: 100%; border-radius: 6px; }
    .md hr { border: none; border-top: 2px solid var(--border); margin: 28px 0; }

    /* ── Home page ── */
    .home-hero { margin-bottom: 28px; }
    .home-hero h1 { font-size: 28px; margin-bottom: 6px; border: none; }
    .home-hero p { color: var(--text-dim); }
    .home-stats { display: flex; gap: 20px; margin-top: 10px; font-size: 13px; color: var(--text-dim); }
    .home-stats span { background: var(--bg-code); padding: 3px 10px; border-radius: 12px; font-weight: 500; }
    .cat-section h2 { font-size: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-dim); margin: 28px 0 12px; border: none; padding: 0; }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 10px;
    }
    .card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      cursor: pointer;
      text-decoration: none;
      color: var(--text);
      display: block;
      transition: border-color .15s, box-shadow .15s;
    }
    .card:hover { border-color: var(--accent); box-shadow: 0 1px 4px rgba(9,105,218,.1); text-decoration: none; }
    .card h3 { font-size: 14px; font-weight: 600; margin: 0 0 4px; }
    .card p { font-size: 12px; color: var(--text-dim); margin: 0; line-height: 1.45; }
  </style>
</head>
<body>

<nav id="sidebar">
  <div class="side-header">
    <h1><a href="#" onclick="showHome(); return false;">YAM Docs</a></h1>
    <div class="subtitle">Bimanual Robot Platform</div>
  </div>
  <input id="search-box" type="text" placeholder="Search docs..." oninput="filterDocs(this.value)" />
  <div id="nav-tree"></div>
</nav>

<div id="content-wrap">
  <main id="content"></main>
</div>

<script>
// ═══════════════════════════════════════════════════════
// Markdown renderer — uses marked.js v9.1.6 (loaded via CDN)
// ═══════════════════════════════════════════════════════
function renderMarkdown(src) {
  if (typeof marked !== 'undefined' && marked.parse) {
    return marked.parse(src);
  }
  // Fallback: show raw text in a readable way if CDN fails
  return '<pre style="white-space:pre-wrap;font-size:14px;">' +
    src.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') +
    '</pre><p style="color:red;margin-top:12px;">Markdown library failed to load. Check your network connection.</p>';
}

// ═══════════════════════════════════════════════════════
// Document Registry
// ═══════════════════════════════════════════════════════
const DOCS = [
  { file: "INSTALL.md",               title: "Installation",                   desc: "Clone with submodules, extras matrix, PLD runtime, verification",       cat: "Getting Started" },
  { file: "DEPENDENCIES.md",          title: "Dependencies",                   desc: "Dependency and licensing overview, what is and is not stored in Git",   cat: "Getting Started" },
  { file: "REAL_WORLD_WORKFLOWS.md",  title: "Real-World Workflows",           desc: "Station bring-up, calibration, services, and task execution end to end", cat: "Getting Started" },
  { file: "NEW_TASK.md",              title: "Authoring a New Task",           desc: "How to add a task capsule and wire it into the CaP runtime",            cat: "Getting Started" },

  { file: "CAP_DESIGN.md",            title: "CAP System Architecture",        desc: "Code-as-Policy agent architecture and layer stack",                     cat: "CAP Framework" },
  { file: "CAP_SYSTEM_DASHBOARD.md",  title: "System Dashboard",               desc: "Bringup system dashboard for service status and health",                cat: "CAP Framework" },
  { file: "SAFETY_ZONE_DESIGN.md",    title: "Safety Zone Design",             desc: "Task-aware end-effector safety zones for RL exploration",               cat: "CAP Framework" },
  { file: "VISER_IK_TELEOP_DESIGN.md",title: "Viser IK Teleop",                desc: "Viser-based IK teleoperation design and workflow",                      cat: "CAP Framework" },
  { file: "AGENT_PIPELINE_DESIGN.md", title: "Agent Pipeline Design",          desc: "Agent pipeline: steps, context, visual diff, execution memory, logging", cat: "CAP Framework" },
  { file: "VISER_CUROBO_PLANNER.md",  title: "Viser cuRobo Planner",           desc: "Interactive Viser 3D UI for cuRobo motion planning, AnyGrasp, gizmo",    cat: "CAP Framework" },

  { file: "RL_PIPELINE_DESIGN.md",    title: "RL Pipeline Design",             desc: "RL training pipeline: serve_rl_policy, learn_skill, diagnostics",       cat: "RL & Training" },
  { file: "REWARD_MODULE.md",         title: "Reward Module",                  desc: "Reward specification and scoring for real-world RL runs",               cat: "RL & Training" },

  { file: "SKILL_LIBRARY.md",         title: "Skill Library — Overview",       desc: "Full tool catalog, data types, per-env comparison",                     cat: "Skills & Vision" },
  { file: "SKILL_LIBRARY_YAM.md",     title: "Skill Library — YAM",            desc: "YAM bimanual tools, table bussing, RL workflow, hardware notes",        cat: "Skills & Vision" },
  { file: "PHYSICAL_TOOLS_GUIDE.md",  title: "Physical Tools Guide",           desc: "Guide to the physical robot tool surface and safety classes",           cat: "Skills & Vision" },
  { file: "TABLE_BUSSING_SKILLS.md",  title: "Table Bussing Skills",           desc: "Table bussing skill tools: tracking, freespace move, nudge, gripper",   cat: "Skills & Vision" },
  { file: "BUNDLESDF_OBJECT_DETECTION.md", title: "BundleSDF Object Detection",desc: "BundleSDF multi-object 6-DOF pose tracking system",                     cat: "Skills & Vision" },
  { file: "VLM_QUERY.md",             title: "VLM Query Pipeline",             desc: "Vision-language model query pipeline for scene understanding",          cat: "Skills & Vision" },
  { file: "grasp_orientation.md",     title: "Grasp Orientation",              desc: "Grasp orientation strategies and approach vectors",                     cat: "Skills & Vision" },
  { file: "VOICE_INPUT.md",           title: "Voice Input",                    desc: "Voice input integration for natural language commands",                 cat: "Skills & Vision" },

  { file: "CALIBRATION_BOARD.md",     title: "ChArUco Calibration Board",      desc: "Generate, print, and mount the board; per-step mounting and failures",  cat: "Hardware & Setup" },
  { file: "CUROBO_SETUP.md",          title: "cuRobo Setup",                   desc: "Submodule init, extras, driver requirements, Warp JIT, port 8611",      cat: "Hardware & Setup" },
  { file: "ANYGRASP_SETUP.md",        title: "AnyGrasp Setup",                 desc: "Per-machine licence application, SDK build, env vars, 2D alternative",  cat: "Hardware & Setup" },
  { file: "MULTI_CAMERA_CONFIG.md",   title: "Multi-Camera Config",            desc: "Multi-source camera configuration (per-station RealSense/ZED)",         cat: "Hardware & Setup" },
  { file: "SERIAL_FOOTSWITCH.md",     title: "Serial Footswitch",              desc: "Serial 3-button footswitch (Waveshare RP2040-Zero) integration",       cat: "Hardware & Setup" },
  { file: "MACMINI_SETUP.md",         title: "Mac Mini Setup",                 desc: "Mac Mini workstation setup and configuration guide",                    cat: "Hardware & Setup" },

  { file: "remote_serving.md",        title: "Remote Serving",                 desc: "Remote GPU skill server deployment and configuration",                 cat: "Data & Tools" },
];

const ASSETS = [
  { file: "cap_architecture.excalidraw", title: "CAP Architecture Diagram",   desc: "Excalidraw diagram of CAP architecture",          cat: "Diagrams" },
  { file: "code_editor_to_arm_server.svg",title: "Code Editor to Arm Server",  desc: "SVG: code editor to arm server flow",              cat: "Diagrams" },
  { file: "chat_to_code_editor.svg",      title: "Chat to Code Editor",        desc: "SVG: chat to code editor flow",                    cat: "Diagrams" },
];

const ALL = [...DOCS, ...ASSETS];
const CAT_ORDER = ["Getting Started", "CAP Framework", "RL & Training", "Skills & Vision", "Hardware & Setup", "Data & Tools", "Diagrams"];

// ═══════════════════════════════════════════════════════
// Sidebar nav
// ═══════════════════════════════════════════════════════
function buildNav() {
  const tree = document.getElementById("nav-tree");
  const cats = {};
  for (const d of ALL) (cats[d.cat] = cats[d.cat] || []).push(d);

  for (const cat of CAT_ORDER) {
    if (!cats[cat]) continue;
    const h = document.createElement("div");
    h.className = "cat-header";
    h.textContent = cat;
    h.onclick = () => h.classList.toggle("collapsed");
    tree.appendChild(h);

    const ul = document.createElement("ul");
    ul.className = "cat-list";
    for (const d of cats[cat]) {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = "#" + d.file;
      a.textContent = d.title;
      a.title = d.desc;
      a.dataset.file = d.file;
      a.dataset.search = (d.title + ' ' + d.desc + ' ' + d.file).toLowerCase();
      a.onclick = e => { e.preventDefault(); loadDoc(d.file); };
      li.appendChild(a);
      ul.appendChild(li);
    }
    tree.appendChild(ul);
  }
}

// ═══════════════════════════════════════════════════════
// Load & render a doc
// ═══════════════════════════════════════════════════════
const cache = {};

async function loadDoc(file) {
  history.replaceState(null, "", "#" + file);
  document.querySelectorAll(".cat-list a").forEach(a => a.classList.toggle("active", a.dataset.file === file));

  const el = document.getElementById("content");
  const title = (ALL.find(d => d.file === file) || {}).title || file;
  const crumb = '<div class="crumb"><a href="#" onclick="showHome(); return false;">Home</a> &rsaquo; ' + title + '</div>';

  // SVG
  if (file.endsWith(".svg")) {
    el.innerHTML = crumb + '<div class="md"><h1>' + title + '</h1><img src="' + file + '" alt="' + file + '" /></div>';
    return;
  }
  // HTML (not self)
  if (file.endsWith(".html") && file !== "index.html") {
    el.innerHTML = crumb + '<div class="md"><h1>' + title + '</h1></div><iframe src="' + file + '" style="width:100%;height:calc(100vh - 160px);border:1px solid var(--border);border-radius:8px;margin-top:12px;"></iframe>';
    return;
  }
  // Excalidraw
  if (file.endsWith(".excalidraw")) {
    el.innerHTML = crumb + '<div class="md"><h1>' + title + '</h1><p>Download: <a href="' + file + '" download>' + file + '</a></p></div>';
    return;
  }

  // Markdown
  el.innerHTML = crumb + '<div class="md" style="color:var(--text-dim)">Loading...</div>';

  try {
    if (!cache[file]) {
      const r = await fetch(file);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      cache[file] = await r.text();
    }
    const html = renderMarkdown(cache[file]);
    el.innerHTML = crumb + '<div class="md">' + html + '</div>';

    // Rewrite .md links to stay in wiki
    el.querySelectorAll(".md a").forEach(a => {
      const href = a.getAttribute("href");
      if (href && href.endsWith(".md") && !href.startsWith("http")) {
        a.onclick = e => { e.preventDefault(); loadDoc(href); };
      }
    });

    el.scrollTop = 0;
  } catch (err) {
    el.innerHTML = crumb + '<div class="md"><h1>Error</h1><p>Could not load <code>' + file + '</code>: ' + err.message + '</p><p>Serve this directory first:</p><pre><code>python3 -m http.server 8000 -d docs/</code></pre></div>';
  }
}

// ═══════════════════════════════════════════════════════
// Search
// ═══════════════════════════════════════════════════════
function filterDocs(q) {
  q = q.toLowerCase().trim();
  document.querySelectorAll(".cat-list a").forEach(a => {
    a.classList.toggle("hidden", q !== '' && !a.dataset.search.includes(q));
  });
  document.querySelectorAll(".cat-header").forEach(h => {
    const ul = h.nextElementSibling;
    if (!ul) return;
    if (q) h.classList.toggle("collapsed", !ul.querySelector("a:not(.hidden)"));
    else h.classList.remove("collapsed");
  });
}

// ═══════════════════════════════════════════════════════
// Home page
// ═══════════════════════════════════════════════════════
function showHome() {
  history.replaceState(null, "", window.location.pathname);
  document.querySelectorAll(".cat-list a").forEach(a => a.classList.remove("active"));

  const cats = {};
  for (const d of ALL) (cats[d.cat] = cats[d.cat] || []).push(d);

  let h = '<div class="home-hero"><h1>YAM Documentation</h1>';
  h += '<p>Bimanual robot platform &mdash; Code as Policy (CAP) agent framework with RL training pipeline.</p>';
  h += '<div class="home-stats"><span>' + DOCS.length + ' docs</span><span>' + ASSETS.length + ' diagrams</span></div></div><hr style="border:none;border-top:1px solid var(--border);margin:24px 0;">';

  for (const cat of CAT_ORDER) {
    if (!cats[cat]) continue;
    h += '<div class="cat-section"><h2>' + cat + '</h2><div class="card-grid">';
    for (const d of cats[cat]) {
      h += '<a class="card" href="#' + d.file + '" onclick="event.preventDefault();loadDoc(\'' + d.file + '\')">';
      h += '<h3>' + d.title + '</h3><p>' + d.desc + '</p></a>';
    }
    h += '</div></div>';
  }

  document.getElementById("content").innerHTML = h;
}

// ═══════════════════════════════════════════════════════
// Init
// ═══════════════════════════════════════════════════════
buildNav();
if (window.location.hash) loadDoc(window.location.hash.slice(1));
else showHome();
window.addEventListener("hashchange", () => {
  if (window.location.hash) loadDoc(window.location.hash.slice(1));
  else showHome();
});
</script>
</body>
</html>
