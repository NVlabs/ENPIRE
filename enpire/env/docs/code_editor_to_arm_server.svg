<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="980" viewBox="0 0 1900 980">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #4b5563; }
      .box-title { font: 700 17px Arial, sans-serif; fill: #111827; }
      .box-text { font: 400 14px Arial, sans-serif; fill: #1f2937; }
      .small { font: 400 12px Arial, sans-serif; fill: #4b5563; }
      .step { font: 700 13px Arial, sans-serif; fill: #ffffff; }
      .lane { font: 700 13px Arial, sans-serif; fill: #374151; }
      .note { font: 700 12px Arial, sans-serif; fill: #92400e; }
    </style>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
    </marker>
    <marker id="arrowDash2" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1900" height="980" fill="#f8fafc"/>
  <text x="40" y="50" class="title">Code Editor -&gt; cap_agent -&gt; cap_server -&gt; arm_server</text>
  <text x="40" y="78" class="subtitle">Execution path when user clicks Execute Code in editor.</text>

  <!-- Lanes -->
  <rect x="40" y="105" width="300" height="36" rx="8" fill="#e5e7eb"/>
  <text x="62" y="129" class="lane">UI</text>
  <rect x="370" y="105" width="430" height="36" rx="8" fill="#e5e7eb"/>
  <text x="392" y="129" class="lane">cap_agent (REST + Executor)</text>
  <rect x="830" y="105" width="350" height="36" rx="8" fill="#e5e7eb"/>
  <text x="852" y="129" class="lane">Tool Layer (Portal Client)</text>
  <rect x="1210" y="105" width="360" height="36" rx="8" fill="#e5e7eb"/>
  <text x="1232" y="129" class="lane">cap_server (RPC + CONTROL_FREQ_HZ loop)</text>
  <rect x="1600" y="105" width="260" height="36" rx="8" fill="#e5e7eb"/>
  <text x="1622" y="129" class="lane">arm_server(s)</text>

  <!-- Step 1 -->
  <circle cx="70" cy="200" r="18" fill="#2563eb"/>
  <text x="64" y="205" class="step">1</text>
  <rect x="100" y="165" width="220" height="95" rx="10" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="114" y="188" class="box-title">CodeEditor execute</text>
  <text x="114" y="210" class="box-text">User clicks Execute Code</text>
  <text x="114" y="230" class="small">App.tsx -&gt; api.execute(editorCode)</text>

  <!-- Step 2 -->
  <circle cx="400" cy="200" r="18" fill="#2563eb"/>
  <text x="394" y="205" class="step">2</text>
  <rect x="430" y="165" width="340" height="95" rx="10" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="444" y="188" class="box-title">POST /api/execute</text>
  <text x="444" y="210" class="box-text">Body: { code: &lt;python&gt; }</text>
  <text x="444" y="230" class="small">State-gated in cap_agent.execute_code()</text>

  <!-- Step 3 -->
  <circle cx="400" cy="340" r="18" fill="#2563eb"/>
  <text x="394" y="345" class="step">3</text>
  <rect x="430" y="300" width="340" height="105" rx="10" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="444" y="323" class="box-title">Executor construction</text>
  <text x="444" y="345" class="box-text">_make_executor() injects tool callables</text>
  <text x="444" y="365" class="box-text">run_in_executor(..., executor.execute)</text>
  <text x="444" y="385" class="small">status: executing; logs streamed via WS</text>

  <!-- Step 4 -->
  <circle cx="400" cy="495" r="18" fill="#2563eb"/>
  <text x="394" y="500" class="step">4</text>
  <rect x="430" y="455" width="340" height="105" rx="10" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="444" y="478" class="box-title">Sandboxed statement exec</text>
  <text x="444" y="500" class="box-text">Executor parses AST and execs each node</text>
  <text x="444" y="520" class="box-text">Tool calls become Python function calls</text>
  <text x="444" y="540" class="small">supports pause/cancel/wait_for_agent</text>

  <!-- Step 5 -->
  <circle cx="860" cy="495" r="18" fill="#2563eb"/>
  <text x="854" y="500" class="step">5</text>
  <rect x="890" y="455" width="260" height="105" rx="10" fill="#dcfce7" stroke="#86efac"/>
  <text x="904" y="478" class="box-title">Native tool wrapper</text>
  <text x="904" y="500" class="box-text">e.g. freespace_move / set_gripper /</text>
  <text x="904" y="520" class="box-text">move_joint_keypoints</text>
  <text x="904" y="540" class="small">portal.Client(...).method(...).result()</text>

  <!-- Step 6 -->
  <circle cx="1240" cy="495" r="18" fill="#2563eb"/>
  <text x="1234" y="500" class="step">6</text>
  <rect x="1270" y="455" width="270" height="105" rx="10" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="1284" y="478" class="box-title">cap_server RPC method</text>
  <text x="1284" y="500" class="box-text">Portal bind receives command</text>
  <text x="1284" y="520" class="box-text">updates _cmd_left/_cmd_right targets</text>
  <text x="1284" y="540" class="small">returns success/reason to tool wrapper</text>

  <!-- Step 7 -->
  <circle cx="1240" cy="655" r="18" fill="#2563eb"/>
  <text x="1234" y="660" class="step">7</text>
  <rect x="1270" y="615" width="270" height="115" rx="10" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="1284" y="638" class="box-title">CONTROL_FREQ_HZ control loop</text>
  <text x="1284" y="660" class="box-text">Reads observations</text>
  <text x="1284" y="680" class="box-text">Then sends command_joint_state()</text>
  <text x="1284" y="700" class="box-text">for left/right arms each tick</text>
  <text x="1284" y="720" class="small">skips send when estopped</text>

  <!-- Step 8 -->
  <circle cx="1630" cy="655" r="18" fill="#2563eb"/>
  <text x="1624" y="660" class="step">8</text>
  <rect x="1660" y="615" width="190" height="115" rx="10" fill="#ffedd5" stroke="#fdba74"/>
  <text x="1674" y="638" class="box-title">Follower arm_server</text>
  <text x="1674" y="660" class="box-text">Receives command_joint_state</text>
  <text x="1674" y="680" class="box-text">drives YamRobot motors</text>
  <text x="1674" y="700" class="box-text">serves get_observations</text>
  <text x="1674" y="720" class="small">(left/right ports)</text>

  <!-- Feedback -->
  <rect x="430" y="785" width="1120" height="125" rx="12" fill="#ecfeff" stroke="#67e8f9"/>
  <text x="448" y="812" class="box-title">Feedback and UI observability</text>
  <text x="448" y="835" class="box-text">ExecutionLog -&gt; cap_agent broadcasts execution_log/status_change/state_update/camera_frame over /ws</text>
  <text x="448" y="858" class="box-text">UI updates action log, status badges, robot state panels, camera views in near real-time.</text>
  <text x="448" y="885" class="small">Path: cap_agent.on_log() + _broadcast_loop() -&gt; useRobotState.ts subscriptions</text>

  <!-- Main arrows -->
  <line x1="320" y1="207" x2="420" y2="207" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <line x1="600" y1="260" x2="600" y2="297" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <line x1="600" y1="405" x2="600" y2="452" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <line x1="770" y1="507" x2="880" y2="507" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <line x1="1150" y1="507" x2="1260" y2="507" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <line x1="1405" y1="560" x2="1405" y2="612" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <line x1="1540" y1="672" x2="1650" y2="672" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow2)"/>

  <!-- Debug-mode bypass note -->
  <line x1="600" y1="560" x2="600" y2="720" stroke="#6b7280" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrowDash2)"/>
  <rect x="470" y="720" width="260" height="50" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="484" y="742" class="note">Debug mode branch:</text>
  <text x="484" y="759" class="small">motion callables swap to simulated robot, bypassing cap_server motion RPC.</text>

  <!-- Footnote -->
  <text x="40" y="948" class="small">Implementation anchors: cap/ui/src/App.tsx, cap/ui/src/api/client.ts, cap/agent/cap_agent.py, cap/agent/executor.py, cap/agent/tools/native.py, cap/server/cap_server.py, robot/yam/arm_server.py</text>
</svg>
