schema_version: 1
policy:
  strategy: facade-first
  requirement: characterize existing behavior before refactoring
  credentials_allowed: false

repositories:
  target:
    path_hint: ENPIRE
    branch: release
    commit: 2b34f9d
    license_status: Apache-2.0

  forge_pusht:
    path_hint: forge
    branch: internal-forge
    commit: 3cc5e899
    license_status: Apache-2.0
    include:
      - cap/saved_scripts/place_grasped_t_reset.py
      - cap/saved_scripts/pusht/
      - rl/pusht/
      - rl/pusht_runner.py
      - tmux/realworld_rl/pusht_supervisor.py
      - tmux/realworld_rl/rl_pusht.sh
      - tmux/realworld_rl/tasks_config/pusht/

  minimal_policy_pld:
    path_hint: minimal_policy
    branches:
      - name: origin/main
        commit: abae3de
      - name: internal-forge
        commit: 1f7378d
      - name: internal-forge
        commit: cba0c0a
      - name: internal-forge
        commit: 81988f0
    license_status: source-mit-license-copied-root-review-still-required
    include:
      - scripts/pld_lite/
      - scripts/actor_gear.sh
      - scripts/learner_gear.sh
      - scripts/sr_rolling_window.py
      - configs/action_scaling/
      - configs/action_transform/
      - configs/env/remote_deployment.yaml
      - configs/experiment/pin_insertion_delta_eef.yaml
      - configs/experiment/gpu_insertion_delta_eef.yaml
      - configs/experiment/ziptie_delta_eef.yaml
      - configs/task/remote_yam*.yaml
      - configs/train/sac_mini.yaml
      - serl_launcher/serl_launcher/agents/continuous/sac_mini.py
      - serl_launcher/serl_launcher/common/
      - serl_launcher/serl_launcher/data_andy_fix/
      - serl_launcher/serl_launcher/env/remote_deployment_env.py
      - serl_launcher/serl_launcher/networks/
      - serl_launcher/serl_launcher/vision/
      - third_party/agentlace/
    exclude:
      - token_usage/
      - research_notes/
      - third_party/Isaac-GR00T
      - flywheel/yam_env/
    exclusion_reason: retain only the PLD real-world actor/learner dependency closure
