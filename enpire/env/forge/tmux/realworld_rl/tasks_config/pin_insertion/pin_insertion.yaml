server_address: localhost:8965
task_name: pin_insertion
control_mode: delta_ee_pose_translation
enabled_sides: right
resolution: 256
enabled_camera_names: [left, right]
crop_camera_names: [left, right]
crop_region: ["left:160,80,320,320", "right:224,144,192,192"]
mode: learn
handshake_bind_address: tcp://*:1986
enable_eef_force_observation: true
visualize_force_axis: [x, y, z]
visualize_position_axis: [x, y, z]
initial_positions_file: null  # set ENPIRE_RL_INITIAL_POSITIONS to a station-local file
randomize_initial_pose: true
x_init_lim: [-0.002, 0.002]
y_init_lim: [-0.002, 0.002]
z_init_lim: [-0.004, -0.005]
enable_oor_check: true
x_oor_lim: [-0.015, 0.012]
y_oor_lim: [-0.015, 0.012]
z_oor_lim: [-0.07, 0.003]
enable_auto_reward: false  # ENPIRE_RL_REWARD_CONFIG enables station-local auto reward
reward_config_file: null
fastapi_server_host: 127.0.0.1
fastapi_server_port: 8203
restart_key: KEY_F5
auto_eval_num_holes: 1
enable_author_mode: false
enable_eval_mode: false
scaled_control_xyz_scale: [0.25, 0.25, 1.0]
delta_ee_translation_xyz_max: [0.0003, 0.0003, 0.0006]
right_arm_z_force_limit: -1.0
collision_filter_z_threshold: 0.8480
episode_timeout_s: 8.0
action_trail_duration_s: 0.5
reset_max_joint_velocity: 1.2
