objects:
  # Square fence centered near table middle.
  # Inner opening is 0.20m x 0.20m (2x plate outer size 0.10m x 0.10m).
  - name: fence_north
    type: box
    size: [0.110, 0.005, 0.030]
    pos: [0.50, 0.135, 0.775]
    quat: [1, 0, 0, 0]
    rgba: [0.35, 0.35, 0.35, 1.0]
    mass: 1000.0
    friction: [10.0, 1.0, 0.1]

  - name: fence_south
    type: box
    size: [0.110, 0.005, 0.030]
    pos: [0.50, -0.075, 0.775]
    quat: [1, 0, 0, 0]
    rgba: [0.35, 0.35, 0.35, 1.0]
    mass: 1000.0
    friction: [10.0, 1.0, 0.1]

  - name: fence_west
    type: box
    size: [0.005, 0.110, 0.030]
    pos: [0.395, 0.03, 0.775]
    quat: [1, 0, 0, 0]
    rgba: [0.35, 0.35, 0.35, 1.0]
    mass: 1000.0
    friction: [10.0, 1.0, 0.1]

  - name: fence_east
    type: box
    size: [0.005, 0.110, 0.030]
    pos: [0.605, 0.03, 0.775]
    quat: [1, 0, 0, 0]
    rgba: [0.35, 0.35, 0.35, 1.0]
    mass: 1000.0
    friction: [10.0, 1.0, 0.1]

  - name: red_stick
    type: box
    size: [0.025, 0.025, 0.06]  # 50x50x120mm half-extents
    pos: [0.55, 0.25, 0.77]
    quat: [0.5, 0.5, 0.5, 0.5]  # lying on side
    rgba: [0.9, 0.1, 0.1, 1.0]
    mass: 0.02
    friction: [2.0, 0.1, 0.01]

  - name: blue_plate
    type: compound
    # 100x100x10mm plate with a 56x56mm square hole (5.6cm).
    # Four box walls form a frame; positions are local to the body center.
    sub_geoms:
      # top wall:  x=[-50,50] y=[28,50] -> center (0, 39mm), half (50, 11, 5)mm
      - type: box
        size: [0.050, 0.011, 0.025]
        pos:  [0, 0.039, 0]
      # bottom wall: x=[-50,50] y=[-50,-28] -> center (0, -39mm)
      - type: box
        size: [0.050, 0.011, 0.025]
        pos:  [0, -0.039, 0]
      # left wall: x=[-50,-28] y=[-28,28] -> center (-39mm, 0), half (11, 28, 15)mm
      - type: box
        size: [0.011, 0.028, 0.025]
        pos:  [-0.039, 0, 0]
      # right wall: x=[28,50] y=[-28,28] -> center (39mm, 0)
      - type: box
        size: [0.011, 0.028, 0.025]
        pos:  [0.039, 0, 0]
    pos: [0.50, 0.03, 0.77]
    quat: [1, 0, 0, 0]
    rgba: [0.1, 0.2, 0.9, 1.0]
    mass: 0.10
    friction: [2.0, 0.1, 0.01]

# Low friction between stick and plate so stick slides through the hole
contact_pairs:
  - body1: red_stick
    body2: blue_plate
    friction: [0.1, 0.005, 0.001]  # [slide, spin, roll] -> expanded to 5-element
    condim: 3
