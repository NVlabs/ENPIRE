# @package _global_
#
# Dry run: open and close gripper to test reset/eval pipeline.
# Check that all iteration videos show the SAME scene, eval_iter_*.json
# all show same obj_name, and success=False / reward=0.
name: dry_run
task: "Dry run: open and close gripper to test reset/eval"
max_iterations: 3

env:
  name: "robocasa:PickPlaceSinkToCounter"

runtime:
  dry_run: true

steps:
  - observer
  - code_generator
  - executor
  - reward_evaluator

recording:
  enabled: true
  per_iteration: true
