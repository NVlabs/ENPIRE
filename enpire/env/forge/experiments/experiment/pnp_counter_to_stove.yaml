# @package _global_
name: pnp_counter_to_stove
task: "Pick the item from the counter and place it on the stove."
max_iterations: 5

env:
  name: "robocasa:PickPlaceCounterToStove"
  layout_id: 3
  style_id: 5
  seed: 42
  camera_height: 256
  camera_width: 256

policy:
  backend: grootpool
  model: n15
  endpoint: "tcp://127.0.0.1:7070"

runtime:
  agent_name: demo

steps:
  - observer
  - skill_author
  - assembly_generator
  - executor
  - reward_evaluator
  - self_reflection

skill_author:
  prompt:
    - system/robotics_engineer
    - system/coding_style
    - system/skill_library
    - system/skill_author
    - embodiment/robocasa_panda
    - task/robocasa_pnp_counter_to_stove_skills
  max_retries: 2
  allow_no_new_skills: true

assembly_generator:
  prompt:
    - system/robotics_engineer
    - system/coding_style
    - system/skill_library
    - system/assembly_generator
    - embodiment/robocasa_panda
    - task/robocasa_pnp_counter_to_stove_assembly
  max_retries: 2
  forbid_toplevel_def: true
  require_skill_library_imports: false

code_generator:
  prompt:
    - system/robotics_engineer
    - system/coding_style
    - system/skill_library
    - embodiment/robocasa_panda
    - task/robocasa_pnp_counter_to_stove_skills
  context_robot_state: true
  context_task_info: true
  context_tool_history: true
  tool_history_max_chars: 3000
  require_thoughts: true
  retry:
    failure_first: true
    include_previous_code: true
    include_previous_thoughts: true
    include_all_history: true
    max_history_chars: 8000

reflection:
  prompt:
    - system/composite_reflection
  strategy: composite
  cameras: [top, wrist]

skill_library:
  enabled: true
  seed_dir: cap/saved_scripts/robocasa_skill_library

recording:
  enabled: true
  per_iteration: true

reflect: true
