# @package _global_
name: pnp_counter_to_cabinet
task: "Pick the item from the counter and place it in the cabinet."
max_iterations: 5

env:
  name: "robocasa:PickPlaceCounterToCabinet"
  layout_id: 3
  style_id: 5
  seed: 42
  # RoboCasaEnv is pinned to OSC_POSE everywhere — GR00T runs in-distribution,
  # cuRobo joint plans are executed via per-waypoint FK + OSC tick-tracking
  # (see cap/env/robocasa/skills.py:_execute_osc_trajectory).
  # GR00T expects 256×256 camera input; skill tools work at any resolution.
  camera_height: 256
  camera_width: 256

# External closed-loop policy infrastructure for use_policy_output.
# grootpool middleware must be running (tmux/launch_grootpool.sh).
# Rollout budget / chunking is written directly in the agent script.
# ScriptRecorder handles video (recording.enabled below).
policy:
  backend: grootpool
  model: n15
  endpoint: "tcp://127.0.0.1:7070"

runtime:
  agent_name: demo

# Two-stage code generator (see docs/plan/two_stage_code_generator.md).
# stage 1 (skill_author) writes into skill_library/ directly.
# stage 2 (assembly_generator) emits code.py with imports + orchestration only.
steps:
  - observer
  - skill_author
  - assembly_generator
  - executor
  - reward_evaluator
  - self_reflection

skill_author:
  prompt:
    - system/robotics_engineer
    - system/coding_style
    - system/skill_library
    - system/skill_author
    - embodiment/robocasa_panda
    - task/robocasa_pnp_counter_to_cabinet_skills
  max_retries: 2
  allow_no_new_skills: true

assembly_generator:
  prompt:
    - system/robotics_engineer
    - system/coding_style
    - system/skill_library
    - system/assembly_generator
    - embodiment/robocasa_panda
    - task/robocasa_pnp_counter_to_cabinet_assembly
  max_retries: 2
  forbid_toplevel_def: true
  require_skill_library_imports: false

# Legacy single-stage code_generator config — kept so experiments that fall
# back to the old flow still validate. Not used while the two-stage steps
# above are wired into cfg.steps.
code_generator:
  prompt:
    - system/robotics_engineer
    - system/coding_style
    - system/skill_library
    - embodiment/robocasa_panda
    - task/robocasa_pnp_counter_to_cabinet_skills
  context_robot_state: true
  context_task_info: true
  context_tool_history: true
  tool_history_max_chars: 3000
  require_thoughts: true
  retry:
    failure_first: true
    include_previous_code: true
    include_previous_thoughts: true
    include_all_history: true
    max_history_chars: 8000

reflection:
  prompt:
    - system/composite_reflection
  strategy: composite
  cameras: [top, wrist]
  # vlm_backend + vlm_model come from the Hydra group (reflection=...).
  # Defaults to `reflection: gemini` per experiments/config.yaml.

skill_library:
  enabled: true
  seed_dir: cap/saved_scripts/robocasa_skill_library

recording:
  enabled: true
  per_iteration: true

reflect: true
