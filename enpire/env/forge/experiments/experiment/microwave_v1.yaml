# @package _global_
name: microwave_v1
task: "Press the start button on the microwave"
max_iterations: 10

env:
  name: "robocasa:TurnOnMicrowave"

steps:
  - observer
  - code_generator
  - executor
  - reward_evaluator
  - self_reflection

code_generator:
  require_thoughts: true
  retry:
    failure_first: true
    include_previous_code: true
    include_previous_thoughts: true
    include_all_history: true
    max_history_chars: 120000000000000000

reflection:
  strategy: composite
  cameras: [top, wrist]
  vlm_backend: gemini
  scene_query: >
    The robot was attempting this task: {task}
    Describe the robot's current state at the END of this attempt.
    Focus on: where is the gripper/fingertip relative to the target,
    did the robot accomplish the task goal, and what visually went wrong.
  analysis_prompt: >
    Jointly consider the planned approach, the code, the visual evidence, and the
    execution results. In a single unified analysis:
    1. Where did reality diverge from the plan? What does the visual evidence confirm?
    2. What is the root cause? Consider: was the orientation IK-feasible? Did move_eef
       timeout because the target pose was unreachable?
    3. Give 2-4 specific, actionable fixes for the NEXT attempt. If orientation caused
       timeouts, suggest trying different roll angles (0, +/-30, +/-60, +/-90, +/-120, +/-150, 180) around the
       approach axis to find an IK-feasible pose.
    Be concrete. Do NOT rewrite the code. Under 250 words.

recording:
  enabled: true
  per_iteration: true

reflect: true
